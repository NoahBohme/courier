[package]
name = "courier"
version = "0.1.0"
edition = "2024"
description = "A tiny self-hosted Postman alternative with a built-in webhook debugger. One binary, no login."
license = "MIT"
repository = "https://github.com/NoahBohme/courier"
keywords = ["http", "api", "postman", "webhook", "self-hosted"]
categories = ["development-tools", "web-programming::http-client"]

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
